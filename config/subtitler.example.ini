# subtitler configuration, format version 1.
#
# Read from $XDG_CONFIG_HOME/subtitler/config.ini (usually
# ~/.config/subtitler/config.ini), or the path given with --config.
# Every setting is optional and command-line arguments override the
# file. The [subtitles] style state is written back when it changes
# through the web API, so the appliance restores it after a reboot; an
# explicitly supplied video-device, --web, --web-root, or --api-key is
# written back the same way.

[subtitler]
version = 1

[capture]
# The V4L2 capture device (the positional video-device argument).
# Written back when supplied on the command line.
device = /dev/video0
# The CV105 audio capture branch; false on machines without it
# (--no-audio).
audio = true

[output]
# software (default) | pisp | window | null (--output).
mode = software
# The DRM connector id (the positional connector-id argument);
# auto-detected when unset.
#connector-id = 32
# The ALSA playback device (--audio-output-device); the first openable
# vc4-hdmi port is auto-detected when unset.
#audio-device = plughw:CARD=vc4hdmi,DEV=0
# Audio/video offset in milliseconds; positive delays audio
# (--audio-offset).
audio-offset-ms = 0

[web]
# The appliance web server on port 8080 (--web). Written back when
# --web is given.
enabled = false
# Static assets directory (--web-root); the installed
# <data-dir>/subtitler/web is used when unset. Written back when
# --web-root is given.
#root = /usr/local/share/subtitler/web
# The OpenSubtitles API key answered by GET /api/opensubtitles
# (--api-key). Written back when --api-key is given.
#api-key =

[subtitles]
# The attached SRT (--subtitles). Written back when a library title is
# selected through the web API.
#file = /home/pi/.local/state/subtitler/subtitles/m/Movie.tt1234567.srt
visible = true
# The cue delay trim in milliseconds; positive delays cues.
delay-ms = 0
# The cue font: a family from GET /api/fonts, the size in points, and
# the color as #rrggbb.
#font-family = DejaVu Sans
#font-size-pt = 24
#font-color = #ffffff

[whisper]
# The whisper speech-recognition tap (#19): transcribes the capture
# audio and logs it (SUBTITLER_LOG=stream:info). Written back when
# changed through the web API; --whisper=<model-path> overrides for a
# run without touching these keys. Models are never downloaded
# automatically: they live in <state-dir>/models/ and are selected or
# downloaded through the web interface.
enabled = false
# A model file name inside <state-dir>/models/.
#model = ggml-tiny.en.bin
