<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>subtitler</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main>
      <h1>subtitler</h1>

      <details>
        <summary>Preview</summary>
        <img src="/api/preview.mjpeg" alt="Video preview" loading="lazy" />
        <div id="cue-display" hidden>
          <div class="cue" id="cue-now-row">
            <span class="cue-time" id="cue-now-time"></span>
            <output id="cue-now"></output>
          </div>
          <button type="button" class="cue next" id="cue-next-row">
            <span class="cue-time" id="cue-next-time"></span>
            <output id="cue-next"></output>
          </button>
        </div>
      </details>

      <section>
        <h2>Subtitles</h2>
        <input
          type="text"
          id="filter"
          placeholder="Filter by title or IMDb id…"
          aria-label="Filter subtitles"
        />
        <div id="subtitles" class="subtitle-list"></div>

        <div class="controls">
          <button type="button" id="pause">Pause</button>
          <input type="checkbox" id="visible" checked />
          <label for="visible">Visible</label>
          <output id="position">00:00:00</output>
          <button type="button" id="auto-sync" hidden>Auto Sync</button>
          <output id="sync-status"></output>
        </div>

        <form id="seek-form" class="controls">
          <label for="time">Position</label>
          <input type="time" id="time" step="1" max="05:00:00" />
          <button type="submit">Set</button>
        </form>

        <div class="controls">
          <label for="nudge">Nudge (s)</label>
          <input type="number" id="nudge" min="0" step="0.5" value="10" />
          <button type="button" id="nudge-back">-</button>
          <button type="button" id="nudge-forward">+</button>
        </div>

        <div class="controls">
          <label for="font">Font</label>
          <select id="font"></select>
          <label for="font-size">Size (pt)</label>
          <input type="number" id="font-size" min="1" step="1" value="24" />
        </div>

        <div class="controls">
          <label for="font-color">Color</label>
          <input type="color" id="font-color" value="#ffffff" />
          <div id="color-presets"></div>
        </div>

        <div class="controls">
          <label for="convert-fps">Convert to</label>
          <select id="convert-fps">
            <option value="23.976">23.976 (NTSC film)</option>
            <option value="24">24 (film)</option>
            <option value="25">25 (PAL)</option>
            <option value="29.97">29.97 (NTSC)</option>
          </select>
          <button type="button" id="convert">Convert</button>
        </div>
      </section>

      <section id="whisper-section" hidden>
        <h2>Whisper</h2>
        <div class="controls">
          <input type="checkbox" id="whisper-enabled" />
          <label for="whisper-enabled">Transcribe audio</label>
          <label for="whisper-model" id="whisper-model-label">Model</label>
          <select id="whisper-model"></select>
          <button
            type="button"
            id="whisper-delete"
            class="delete"
            aria-label="Delete the selected model"
          >
            ✕
          </button>
          <output id="whisper-status"></output>
        </div>

        <div class="controls" id="whisper-fetch">
          <label for="whisper-download-model">Download</label>
          <select id="whisper-download-model"></select>
          <button type="button" id="whisper-download">Fetch</button>
        </div>
      </section>

      <section>
        <h2>OpenSubtitles</h2>
        <form id="login-form">
          <label for="username">User name</label>
          <input type="text" id="username" autocomplete="username" />
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
          />
          <button type="submit">Log in</button>
        </form>

        <form id="search-form">
          <label for="search">IMDb id</label>
          <input type="text" id="search" placeholder="tt1234567" />
          <button type="submit">Save</button>
          <button type="button" id="try-next" hidden>Try next</button>
        </form>
      </section>
    </main>

    <script type="module">
      import { Subtitler } from "./modules/Subtitler.mjs";
      import { OpenSubtitles } from "./modules/OpenSubtitles.mjs";
      import { convertTo, parseCues } from "./modules/SRT.mjs";

      const library = document.getElementById("subtitles");
      const filter = document.getElementById("filter");
      const pause = document.getElementById("pause");
      const visible = document.getElementById("visible");
      const position = document.getElementById("position");
      const time = document.getElementById("time");
      const seekForm = document.getElementById("seek-form");
      const nudge = document.getElementById("nudge");
      const nudgeBack = document.getElementById("nudge-back");
      const nudgeForward = document.getElementById("nudge-forward");
      const font = document.getElementById("font");
      const fontSize = document.getElementById("font-size");
      const fontColor = document.getElementById("font-color");
      const colorPresets = document.getElementById("color-presets");
      const convertFps = document.getElementById("convert-fps");
      const convert = document.getElementById("convert");
      const whisperSection = document.getElementById("whisper-section");
      const whisperEnabled = document.getElementById("whisper-enabled");
      const whisperModel = document.getElementById("whisper-model");
      const whisperModelLabel = document.getElementById("whisper-model-label");
      const whisperDelete = document.getElementById("whisper-delete");
      const whisperFetch = document.getElementById("whisper-fetch");
      const whisperDownloadModel = document.getElementById(
        "whisper-download-model",
      );
      const whisperDownload = document.getElementById("whisper-download");
      const whisperStatus = document.getElementById("whisper-status");
      const autoSync = document.getElementById("auto-sync");
      const syncStatus = document.getElementById("sync-status");
      const cueDisplay = document.getElementById("cue-display");
      const cueNowRow = document.getElementById("cue-now-row");
      const cueNowTime = document.getElementById("cue-now-time");
      const cueNow = document.getElementById("cue-now");
      const cueNextRow = document.getElementById("cue-next-row");
      const cueNextTime = document.getElementById("cue-next-time");
      const cueNext = document.getElementById("cue-next");

      // The ggml models the appliance can run, fetched by the browser
      // straight from HuggingFace (CORS is allowed on both the resolve
      // redirect and the CDN) and stored through the REST API — the
      // appliance never downloads on its own. English-only models.
      const knownModels = [
        { file: "ggml-tiny.en.bin", label: "tiny.en — 75 MB" },
        { file: "ggml-base.en.bin", label: "base.en — 142 MB" },
        { file: "ggml-small.en.bin", label: "small.en — 466 MB" },
      ];
      const knownModelUrl = (file) =>
        `https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${file}`;

      // The classic subtitle colors first; the picker covers the rest.
      const presetColors = ["#ffffff", "#ffff00", "#00ffff", "#00ff00"];

      for (const color of presetColors) {
        const swatch = document.createElement("button");
        swatch.type = "button";
        swatch.className = "swatch";
        swatch.dataset.color = color;
        swatch.style.background = color;
        swatch.setAttribute("aria-label", `Set subtitle color ${color}`);
        swatch.addEventListener("click", () => setFontColor(color));
        colorPresets.appendChild(swatch);
      }
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const loginForm = document.getElementById("login-form");
      const search = document.getElementById("search");
      const searchForm = document.getElementById("search-form");
      const tryNext = document.getElementById("try-next");

      const subtitler = new Subtitler(new URL("api/", location.href).href);

      const endpoint = "https://api.opensubtitles.com/api/v1/";
      // Without --api-key the key endpoint isn't registered; the
      // OpenSubtitles section stays disabled but must not take the
      // subtitle controls down with it.
      const subtitles = await subtitler
        .apiKey()
        .then(({ api_key }) => new OpenSubtitles(endpoint, api_key))
        .catch(() => null);

      async function authenticate() {
        if (subtitles === null) {
          return;
        }
        await subtitles.login(username.value, password.value);
      }

      // Uploads answer the library-relative <bucket>/<title>; the
      // library list and the radio values use the bare title.
      function libraryTitle(name) {
        return name.replace(/^.\//, "");
      }

      function imdbId(name) {
        return name.match(/tt(\d+)\.srt$/i)?.[1];
      }

      // The rate tag in `<title>.<fps>fps.tt<id>.srt`; "" when the
      // filename doesn't carry one.
      function fpsTag(name) {
        return name.match(/\.(\d+(?:\.\d+)?)fps\.tt\d+\.srt$/i)?.[1] ?? "";
      }

      // The OpenSubtitles version tag in
      // `<title>.os<subtitle-id>[.<fps>fps].tt<id>.srt`; null for legacy
      // uploads that predate tagging.
      function subtitleVersion(name) {
        return name.match(/\.os(\d+)\./i)?.[1] ?? null;
      }

      function subtitleRow(file, index) {
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "subtitle";
        radio.id = `subtitle-${index}`;
        radio.value = file;

        const label = document.createElement("label");
        label.htmlFor = radio.id;

        const base = libraryTitle(file).replace(/\.srt$/i, "");
        const parsed = base.match(/^(.*)\.(tt\d+)$/i);
        const title = document.createElement("span");
        title.textContent = parsed ? parsed[1] : base;
        label.appendChild(title);

        if (parsed) {
          const imdb = document.createElement("span");
          imdb.className = "imdb";
          imdb.textContent = parsed[2];
          label.appendChild(imdb);
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.textContent = "✕";
        remove.setAttribute("aria-label", `Delete ${base}`);
        remove.addEventListener("click", () => deleteSubtitle(file));

        const row = document.createElement("div");
        row.className = "subtitle";
        row.append(radio, label, remove);
        return row;
      }

      async function deleteSubtitle(file) {
        await subtitler.remove(file);
        await refreshSubtitles();
        // The delete may have detached the active subtitle; pull the
        // state and re-select whatever is attached now.
        applyState(await subtitler.state());
      }

      let knownFiles = [];

      async function refreshSubtitles() {
        library.replaceChildren();
        knownFiles = await subtitler.list();
        knownFiles.forEach((file, i) =>
          library.appendChild(subtitleRow(file, i)),
        );
        applyFilter();
        updateTryNextState();
        return knownFiles;
      }

      // Fuzzy filter, VSCode-style: the query's characters must appear
      // in order — "der wo" matches "Deer Woman…". Spaces don't count.
      // The stored name carries the title and the tt<id> tag, so title
      // text and IMDb id searches are the same check.
      function fuzzyMatch(needle, haystack) {
        let i = 0;
        for (const ch of haystack) {
          if (ch === needle[i]) {
            i += 1;
          }
        }
        return i === needle.length;
      }

      function applyFilter() {
        const needle = filter.value.toLowerCase().replace(/\s+/g, "");
        for (const row of library.children) {
          const file = row.querySelector("input").value;
          row.hidden = !fuzzyMatch(needle, file.toLowerCase());
        }
      }

      function searchedImdbId() {
        return search.value.trim().toLowerCase().replace(/^tt/, "");
      }

      // Trying the next candidate makes sense once the library carries
      // anything for the searched title.
      function updateTryNextState() {
        const id = searchedImdbId();
        tryNext.hidden =
          subtitles === null ||
          id === "" ||
          !knownFiles.some((file) => imdbId(file) === id);
      }

      // Radio selection lives in applyState: the checked radio always
      // mirrors currentFile, never the other way around.
      function selectRadio(file) {
        for (const radio of library.querySelectorAll(
          'input[name="subtitle"]',
        )) {
          radio.checked = file !== null && radio.value === file;
        }
      }

      // Downloads the candidate, stores it under its version tag, and
      // selects it. The appliance switches to the upload live: position
      // 0, unpaused.
      async function fetchCandidate({ attributes }, id) {
        const { files, feature_details } = attributes;
        if (files.length < 1) {
          return;
        }

        const result = await subtitles.download(
          files[0].file_id,
          feature_details.movie_name,
        );
        // Tag the release's rate so the convert control knows the source
        // timing; 0 means unknown and stays untagged. The version tag is
        // how try-next tells apart the candidates already in the
        // library.
        const tag = Number(attributes.fps) > 0 ? `.${attributes.fps}fps` : "";
        const version = `.os${attributes.subtitle_id}`;
        await subtitler.upload(
          `${feature_details.movie_name}${version}${tag}.tt${id}.srt`,
          result,
        );
        await refreshSubtitles();
        // The appliance switches to the upload live: position 0,
        // unpaused. Apply the authoritative state.
        applyState(await subtitler.state());
      }

      async function download() {
        if (subtitles === null) {
          return;
        }

        const id = searchedImdbId();
        const known = await refreshSubtitles();
        const existing = known.find((file) => imdbId(file) === id);
        if (existing) {
          applyState(await subtitler.select(existing));
          return;
        }

        if (!subtitles.authenticated) {
          await authenticate();
        }

        const { data } = await subtitles.search(search.value);
        if (data.length < 1) {
          return;
        }

        await fetchCandidate(data[0], id);
      }

      // Advances to the first candidate ranked past the frontier
      // (#453): the newest remaining download is the tombstone, so
      // everything ranked at or before the furthest-ranked version the
      // library carries counts as tried — deleting bad downloads behind
      // the frontier never re-fetches them; deleting everything for a
      // title starts over. Legacy uploads carry no version tag and
      // can't anchor the frontier — they cost one re-download.
      async function tryNextCandidate() {
        if (subtitles === null) {
          return;
        }

        const id = searchedImdbId();
        if (id === "") {
          return;
        }

        if (!subtitles.authenticated) {
          await authenticate();
        }

        const { data } = await subtitles.search(search.value);
        const ranked = data.map(({ attributes }) => attributes.subtitle_id);
        let frontier = -1;
        for (const file of knownFiles) {
          if (imdbId(file) !== id) {
            continue;
          }
          const version = subtitleVersion(file);
          if (version !== null) {
            // A version missing from the current page can't anchor.
            frontier = Math.max(frontier, ranked.indexOf(version));
          }
        }
        const candidate = data.find((unused, index) => index > frontier);
        if (candidate !== undefined) {
          await fetchCandidate(candidate, id);
        }
      }

      function selectedSubtitle() {
        return library.querySelector("input:checked")?.value;
      }

      // Converting needs a tagged source rate and a different target.
      function updateConvertState() {
        const source = fpsTag(selectedSubtitle() ?? "");
        convert.disabled =
          source === "" ||
          Number.parseFloat(source) === Number.parseFloat(convertFps.value);
      }

      async function convertSelected() {
        const file = selectedSubtitle();
        const source = file ? fpsTag(file) : "";
        const target = convertFps.value;
        if (
          source === "" ||
          Number.parseFloat(source) === Number.parseFloat(target)
        ) {
          return;
        }

        const { body } = await subtitler.download(file);
        const converted = convertTo(
          body,
          Number.parseFloat(source),
          Number.parseFloat(target),
        );
        const converted_name = file.replace(
          /\.\d+(?:\.\d+)?fps\.tt(\d+)\.srt$/i,
          `.${target}fps.tt$1.srt`,
        );
        await subtitler.upload(converted_name, converted);
        await refreshSubtitles();
        // The appliance switches to the upload live: position 0,
        // unpaused. Apply the authoritative state.
        applyState(await subtitler.state());
      }

      let paused = false;
      let positionMs = 0;
      let anchoredAt = performance.now();
      let currentFontFamily = null;
      let currentFontSize = null;
      let currentFontColor = null;

      function anchorPosition(ms) {
        if (!Number.isFinite(ms)) {
          return;
        }
        positionMs = ms;
        anchoredAt = performance.now();
      }

      function currentPosition() {
        return paused
          ? positionMs
          : positionMs + performance.now() - anchoredAt;
      }

      let currentFile = null;
      let syncAvailable = false;
      let syncPoll = null;
      let activeCues = [];
      let cuesFile = null;
      let nextStart = null;

      // The now/next display parses the attached SRT once, tracked by
      // title; a stale response from an earlier switch is dropped.
      async function loadCues(file) {
        cuesFile = file;
        cueDisplay.hidden = file === null;
        if (file === null) {
          activeCues = [];
          return;
        }
        try {
          const { body } = await subtitler.download(file);
          if (cuesFile === file) {
            activeCues = parseCues(body);
          }
        } catch {
          if (cuesFile === file) {
            activeCues = [];
          }
        }
      }

      function updateAutoSyncState() {
        autoSync.disabled =
          !syncAvailable ||
          currentFile === null ||
          !whisperEnabled.checked ||
          syncPoll !== null;
      }

      function applyState({
        file,
        paused: isPaused,
        time: position,
        visible: isVisible,
        font_family: family,
        font_size: size,
        font_color: color,
      }) {
        if (file !== undefined) {
          currentFile = file;
          selectRadio(file);
          updateConvertState();
          if (file !== cuesFile) {
            loadCues(file);
          }
        }
        paused = isPaused;
        anchorPosition(position);
        updateAutoSyncState();
        updatePause();
        // Absent keys (hand-made states) keep the current values; null
        // means "renderer default" and leaves the controls alone.
        if (isVisible !== undefined) {
          visible.checked = isVisible;
        }
        if (family !== undefined) {
          currentFontFamily = family;
          if (family !== null) {
            font.value = family;
          }
        }
        if (size !== undefined) {
          currentFontSize = size;
          if (size !== null) {
            fontSize.value = size;
          }
        }
        if (color !== undefined) {
          currentFontColor = color;
          if (color !== null) {
            fontColor.value = color;
            for (const swatch of colorPresets.children) {
              swatch.classList.toggle(
                "selected",
                swatch.dataset.color === color,
              );
            }
          }
        }
      }

      async function setFontColor(color) {
        applyState(await subtitler.setFontColor(color));
      }

      function updatePause() {
        pause.textContent = paused ? "Play" : "Pause";
      }

      function formatTime(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const units = [
          Math.floor(total / 3600),
          Math.floor((total % 3600) / 60),
          total % 60,
        ];
        return units.map((unit) => String(unit).padStart(2, "0")).join(":");
      }

      // Cues are sorted by start: the last started cue is the showing
      // candidate, the one after it the upcoming one. Each row appears
      // only while it has a cue to show.
      function setCueRow(row, time, output, cue) {
        row.hidden = cue === null;
        if (cue === null) {
          return;
        }
        const start = formatTime(cue.start);
        if (time.textContent !== start) {
          time.textContent = start;
        }
        if (output.textContent !== cue.text) {
          output.textContent = cue.text;
        }
      }

      function updateCueDisplay() {
        const pos = currentPosition();
        let low = 0;
        let high = activeCues.length;
        while (low < high) {
          const mid = Math.floor((low + high) / 2);
          if (activeCues[mid].start <= pos) {
            low = mid + 1;
          } else {
            high = mid;
          }
        }
        const showing =
          low > 0 && pos < activeCues[low - 1].end ? activeCues[low - 1] : null;
        const upcoming = activeCues[low] ?? null;
        nextStart = upcoming?.start ?? null;
        setCueRow(cueNowRow, cueNowTime, cueNow, showing);
        setCueRow(cueNextRow, cueNextTime, cueNext, upcoming);
      }

      function tick() {
        const text = formatTime(currentPosition());
        if (position.textContent !== text) {
          position.textContent = text;
        }
        updateCueDisplay();
      }

      async function togglePause() {
        applyState(await subtitler.setPaused(!paused));
      }

      async function seekTo() {
        const ms = time.valueAsNumber;
        if (Number.isNaN(ms) || !time.validity.valid) {
          return;
        }
        applyState(await subtitler.setTime(ms));
      }

      async function nudgeTime(direction) {
        const seconds = nudge.valueAsNumber;
        if (Number.isNaN(seconds) || !nudge.validity.valid) {
          return;
        }
        applyState(
          await subtitler.setTime(
            Math.max(
              0,
              Math.round(currentPosition() + direction * seconds * 1000),
            ),
          ),
        );
      }

      // Re-sync when another client moved the position. The tolerance
      // absorbs round-trip jitter but must stay below the smallest
      // nudge step, or single nudges get swallowed.
      const syncToleranceMs = 300;
      const syncIntervalMs = 5000;

      async function syncState() {
        let state;
        try {
          state = await subtitler.state();
        } catch {
          return;
        }
        if (
          state.file !== currentFile ||
          state.paused !== paused ||
          state.visible !== visible.checked ||
          state.font_family !== currentFontFamily ||
          state.font_size !== currentFontSize ||
          state.font_color !== currentFontColor ||
          Math.abs(state.time - currentPosition()) > syncToleranceMs
        ) {
          // Another client may have uploaded the attached title; the
          // list must carry it before its radio can be selected.
          if (state.file !== null && !knownFiles.includes(state.file)) {
            try {
              await refreshSubtitles();
            } catch {
              return;
            }
          }
          applyState(state);
        }
      }

      async function refreshFonts() {
        const families = await subtitler.fonts();
        font.replaceChildren(
          ...families.map((family) => new Option(family, family)),
        );
      }

      function applyWhisperState({ enabled, model, models }) {
        whisperEnabled.checked = enabled;
        // The select lists the store; a model set outside it (a
        // --whisper path) shows as its own entry.
        const names = [...models];
        if (model !== null && !names.includes(model)) {
          names.push(model);
        }
        whisperModel.replaceChildren(
          ...names.map((name) => new Option(name, name, false, name === model)),
        );
        // An empty select has nothing to choose or delete.
        whisperModelLabel.hidden = names.length === 0;
        whisperModel.hidden = names.length === 0;
        whisperDelete.hidden = names.length === 0;
        const missing = knownModels.filter(
          ({ file }) => !models.includes(file),
        );
        whisperDownloadModel.replaceChildren(
          ...missing.map(({ file, label }) => new Option(label, file)),
        );
        // Nothing left to download: the row returns when a delete
        // opens a slot again.
        whisperFetch.hidden = missing.length === 0;
        updateAutoSyncState();
      }

      async function startAutoSync() {
        syncStatus.value = "";
        if (syncPoll !== null) {
          clearInterval(syncPoll);
          syncPoll = null;
        }
        try {
          await subtitler.startSubtitleSync();
        } catch (error) {
          // A 409 carries the server's reason ({"state":"failed",
          // "reason":...}); anything else is a transport failure.
          syncStatus.value = error.body?.reason ?? "Couldn't start auto-sync";
          return;
        }
        syncStatus.value = "Listening…";
        syncPoll = setInterval(async () => {
          let state;
          try {
            state = await subtitler.subtitleSync();
          } catch {
            return;
          }
          if (state.state === "listening") {
            return;
          }
          clearInterval(syncPoll);
          syncPoll = null;
          updateAutoSyncState();
          if (state.state === "synced") {
            syncStatus.value = `Synced to ${formatTime(state.time)}`;
            // Pull the corrected position in right away.
            syncState();
          } else if (state.state === "failed") {
            syncStatus.value = state.reason ?? "Sync failed";
          } else {
            syncStatus.value = "";
          }
        }, 2000);
        // Poll assigned first: a running session disables the button.
        updateAutoSyncState();
      }

      async function downloadWhisperModel() {
        const file = whisperDownloadModel.value;
        if (file === "") {
          return;
        }
        whisperDownload.disabled = true;
        try {
          const response = await window.fetch(knownModelUrl(file));
          if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`);
          }
          const total = Number(response.headers.get("content-length")) || 0;
          const chunks = [];
          let received = 0;
          const reader = response.body.getReader();
          for (;;) {
            const { done, value } = await reader.read();
            if (done) {
              break;
            }
            chunks.push(value);
            received += value.length;
            whisperStatus.value = total
              ? `Downloading ${file}… ${Math.round((received / total) * 100)}%`
              : `Downloading ${file}… ${(received / 1e6).toFixed(0)} MB`;
          }
          whisperStatus.value = `Storing ${file}…`;
          await subtitler.uploadWhisperModel(file, new Blob(chunks));
          whisperStatus.value = `Stored ${file}`;
          // A freshly downloaded model is meant to be used: select it.
          applyWhisperState(await subtitler.setWhisper({ model: file }));
        } catch (error) {
          whisperStatus.value = `Download failed: ${error.message}`;
          await refreshWhisper();
        } finally {
          whisperDownload.disabled = false;
        }
      }

      async function deleteWhisperModel() {
        const file = whisperModel.value;
        if (file === "") {
          return;
        }
        try {
          await subtitler.removeWhisperModel(file);
        } catch (error) {
          // A 409 carries the reason ({"reason":...}); anything else is
          // a transport failure.
          whisperStatus.value =
            error.body?.reason ?? "Couldn't delete the model";
          await refreshWhisper();
          return;
        }
        whisperStatus.value = `Deleted ${file}`;
        let state;
        try {
          state = await subtitler.whisper();
        } catch {
          return;
        }
        // Deleting the selected model moves the selection to another
        // stored one, so the gone file doesn't linger as the
        // configured model.
        if (state.model === file && state.models.length > 0) {
          applyWhisperState(
            await subtitler.setWhisper({ model: state.models[0] }),
          );
        } else {
          applyWhisperState(state);
        }
      }

      async function refreshWhisper() {
        try {
          applyWhisperState(await subtitler.whisper());
        } catch {
          // The section stays on the last known state.
        }
      }

      async function create() {
        await refreshSubtitles();
        await refreshFonts();
        const state = await subtitler.state();
        applyState(state);

        // The whisper section degrades like OpenSubtitles: without the
        // endpoint (no state dir, no model store) it stays hidden. Auto
        // Sync hides with the sync endpoint the same way.
        try {
          applyWhisperState(await subtitler.whisper());
          whisperSection.hidden = false;
        } catch {
          whisperSection.hidden = true;
        }
        try {
          await subtitler.subtitleSync();
          syncAvailable = true;
          autoSync.hidden = false;
          updateAutoSyncState();
        } catch {
          autoSync.hidden = true;
        }

        filter.addEventListener("input", applyFilter);
        library.addEventListener("change", async (event) => {
          applyState(await subtitler.select(event.target.value));
          updateConvertState();
        });
        pause.addEventListener("click", togglePause);
        visible.addEventListener("change", async () => {
          applyState(await subtitler.setVisible(visible.checked));
        });
        seekForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          await seekTo();
        });
        nudgeBack.addEventListener("click", () => nudgeTime(-1));
        nudgeForward.addEventListener("click", () => nudgeTime(1));
        cueNextRow.addEventListener("click", async () => {
          if (nextStart === null) {
            return;
          }
          applyState(await subtitler.setTime(nextStart));
        });
        font.addEventListener("change", async () => {
          applyState(await subtitler.setFontFamily(font.value));
        });
        fontSize.addEventListener("change", async () => {
          const size = fontSize.valueAsNumber;
          if (Number.isNaN(size) || !fontSize.validity.valid) {
            return;
          }
          applyState(await subtitler.setFontSize(size));
        });
        fontColor.addEventListener("change", () =>
          setFontColor(fontColor.value),
        );
        convertFps.addEventListener("change", updateConvertState);
        convert.addEventListener("click", convertSelected);
        whisperEnabled.addEventListener("change", async () => {
          try {
            const params = { enabled: String(whisperEnabled.checked) };
            if (whisperModel.value !== "") {
              params.model = whisperModel.value;
            }
            applyWhisperState(await subtitler.setWhisper(params));
          } catch {
            // Enabling needs a stored model; keep the checkbox honest.
            whisperEnabled.checked = !whisperEnabled.checked;
            whisperStatus.value = "Select a downloaded model first";
          }
        });
        whisperModel.addEventListener("change", async () => {
          try {
            applyWhisperState(
              await subtitler.setWhisper({ model: whisperModel.value }),
            );
            whisperStatus.value = "";
          } catch {
            whisperStatus.value = "Model unavailable";
            await refreshWhisper();
          }
        });
        whisperDelete.addEventListener("click", deleteWhisperModel);
        whisperDownload.addEventListener("click", downloadWhisperModel);
        autoSync.addEventListener("click", startAutoSync);
        loginForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          await authenticate();
        });
        searchForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          await download();
        });
        search.addEventListener("input", updateTryNextState);
        tryNext.addEventListener("click", tryNextCandidate);

        setInterval(tick, 250);
        setInterval(syncState, syncIntervalMs);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) {
            syncState();
          }
        });
        window.addEventListener("focus", syncState);
      }

      create();
    </script>
  </body>
</html>
