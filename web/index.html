<!doctype html>
<meta charset="utf-8" />
<title>subtitler</title>
<details>
  <img src="/api/preview.mjpeg" alt="Video preview" loading="lazy" />
</details>
<div id="output"></div>
<div>
  <input type="button" id="pause" value="Pause" />
</div>
<div>
  <input type="time" id="time" step="1" max="05:00:00" />
  <input type="button" id="seek" value="Set" />
</div>
<div>
  <input type="number" id="nudge" min="0" step="any" value="10" />
  <input type="button" id="nudge-back" value="-" />
  <input type="button" id="nudge-forward" value="+" />
</div>
<script type="module">
  import { Subtitler } from "./modules/Subtitler.mjs";
  import { OpenSubtitles } from "./modules/OpenSubtitles.mjs";

  await new Promise((resolve) => addEventListener("load", resolve));

  const output = document.getElementById("output");
  const username = document.getElementById("username");
  const password = document.getElementById("password");
  const login = document.getElementById("login");
  const search = document.getElementById("search");
  const save = document.getElementById("save");
  const pause = document.getElementById("pause");
  const time = document.getElementById("time");
  const seek = document.getElementById("seek");
  const nudge = document.getElementById("nudge");
  const nudgeBack = document.getElementById("nudge-back");
  const nudgeForward = document.getElementById("nudge-forward");
  const select = document.createElement("select");

  const subtitler = new Subtitler(new URL("api/", location.href).href);

  const endpoint = "https://api.opensubtitles.com/api/v1/";
  const { api_key } = await subtitler.apiKey();
  const subtitles = new OpenSubtitles(endpoint, api_key);

  async function authenticate() {
    await subtitles.login(username.value, password.value);
  }

  function imdbId(name) {
    return name.match(/tt(\d+)\.srt$/i)?.[1];
  }

  async function refreshSubtitles() {
    select.replaceChildren();
    const files = await subtitler.list();
    for (const file of files) {
      const option = document.createElement("option");
      option.value = file;
      option.innerText = file;
      select.appendChild(option);
    }
    return files;
  }

  async function download() {
    const id = search.value.trim().toLowerCase().replace(/^tt/, "");
    const known = await refreshSubtitles();
    const existing = known.find((file) => imdbId(file) === id);
    if (existing) {
      select.value = existing;
      await subtitler.select(existing);
      return;
    }

    if (!subtitles.authenticated) {
      await authenticate();
    }

    const { data } = await subtitles.search(search.value);
    if (data.length < 1) {
      return;
    }

    const { attributes } = data[0];
    const { files, feature_details } = attributes;
    if (files < 1) {
      return;
    }

    const result = await subtitles.download(
      files[0].file_id,
      feature_details.movie_name,
    );
    const { stored_name } = await subtitler.upload(
      `${feature_details.movie_name}.tt${id}.srt`,
      result,
    );
    await refreshSubtitles();
    select.value = stored_name;
  }

  let paused = false;

  function updatePause() {
    pause.value = paused ? "Play" : "Pause";
  }

  async function togglePause() {
    ({ paused } = await subtitler.setPaused(!paused));
    updatePause();
  }

  async function seekTo() {
    const ms = time.valueAsNumber;
    if (Number.isNaN(ms) || !time.validity.valid) {
      return;
    }
    ({ paused } = await subtitler.setTime(ms));
    updatePause();
  }

  async function nudgeTime(direction) {
    const seconds = nudge.valueAsNumber;
    if (Number.isNaN(seconds) || !nudge.validity.valid) {
      return;
    }
    const { time_ms } = await subtitler.state();
    ({ paused } = await subtitler.setTime(
      Math.max(0, Math.round(time_ms + direction * seconds * 1000)),
    ));
    updatePause();
  }

  async function create() {
    await refreshSubtitles();
    output.appendChild(select);

    ({ paused } = await subtitler.state());
    updatePause();

    login.addEventListener("click", authenticate);
    save.addEventListener("click", download);
    pause.addEventListener("click", togglePause);
    seek.addEventListener("click", seekTo);
    nudgeBack.addEventListener("click", () => nudgeTime(-1));
    nudgeForward.addEventListener("click", () => nudgeTime(1));
  }

  create();
</script>
<br />
<div>
  <dl>
    <dt><label for="username">User Name: </label></dt>
    <dd><input type="text" id="username" /></dd>
    <dt><label for="password">Password: </label></dt>
    <dd><input type="password" id="password" /></dd>
  </dl>
  <input type="button" id="login" value="Submit" />
</div>
<div>
  <dl>
    <dt><label for="search">Search: </label></dt>
    <dd><input type="text" id="search" /></dd>
  </dl>
  <input type="button" id="save" value="Save" />
</div>
